name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write   # OIDC — npm trusted publishing (no long-lived token)

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm i --no-fund --no-audit
      - name: Typecheck
        run: npx tsc -p tsconfig.json
      - name: Unit + integration tests
        run: npx tsx --test tests/dataset.spec.ts tests/enrich.spec.ts tests/api.spec.ts tests/integration/settings-autofill.spec.ts
      # Both of these execute lib/client.js the way the browser does, so they
      # need a build. The bundle guard catches a classic-script global-scope
      # leak (which only surfaces on the second evaluation: HMR reload or a
      # combo); the injection suite drives the DOM attachment.
      - name: Build (for the client suites)
        run: npm run build
      - name: Client bundle + DOM injection
        run: npx tsx --test tests/client-bundle.spec.ts tests/client-injection.spec.ts

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24          # npm >= 11 understands OIDC trusted publishing
          registry-url: 'https://registry.npmjs.org'
      - name: Install
        run: npm i --no-fund --no-audit
      - name: Build
        run: npm run build
      # Actions injects ACTIONS_ID_TOKEN_REQUEST_* when the job has
      # id-token: write; the npm CLI exchanges them for a short-lived token.
      - name: Publish to npm
        run: npm publish