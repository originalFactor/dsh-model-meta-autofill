name: build and test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install
        run: npm i --ignore-scripts --no-fund --no-audit
      - name: Typecheck
        run: npx tsc -p tsconfig.json
      - name: Unit + integration tests
        run: npx tsx --test tests/dataset.spec.ts tests/enrich.spec.ts tests/discovery.spec.ts tests/discovery-runtime.spec.ts tests/api.spec.ts tests/integration/settings-autofill.spec.ts
      # Both of these execute lib/client.js the way the browser does, so they
      # need a build. The bundle guard catches a classic-script global-scope
      # leak (which only surfaces on the second evaluation: HMR reload or a
      # combo); the injection suite drives the DOM attachment.
      - name: Build (for the client suites)
        run: npm run build
      - name: Client bundle + DOM injection
        run: npx tsx --test tests/client-bundle.spec.ts tests/client-injection.spec.ts
      - name: Pack checked build
        run: npm pack --ignore-scripts
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-model-meta-autofill
          path: dsh-model-meta-autofill-*.tgz
          if-no-files-found: error
